    <main>
        <header class="mmenu internal">
            <h1>12-Graphics</h1>

            <h3>Creates inline graphics with tags.</h3>
        </header>
        <section>
           <h3 class="subtitle">Canvas:</h3>
           <canvas id="circle"></canvas>
           <h3 class="subtitle">SVG:</h3>
           
        </section>
    </main>
    <script>
        const canvas = document.getElementById('circle')
        const context = canvas.getContext('2d')
        context.fillStyle = '#ff0000';
        context.beginPath();
        context.arc(150,60,60,0,Math.PI*2,true);
        context.closePath();
        context.fill();
    </script>
