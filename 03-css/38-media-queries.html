<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>38-media queries</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            transition: all 0.4s ease;
        }
        body {
            background-color: #003675;
            font-family: Poppins, sans-serif;
            color: #fff;

            main {
                border: 4px solid #fff;
                padding: 1rem;
                margin: 2rem auto;
                width: 1230px; /*1280*/

                figure.logo {
                    background: url(imgs/pepsi01.png) no-repeat center;
                    height: 354px;
                    margin: 0 auto;
                    width: 919px;
                }
                h2 {
                    display: none;
                    text-align: center;
                }
                p {
                    line-height: 2rem;
                    text-align: justify;
                }
            }
        }
        /* Breakpoint: > 1280px */
        @media (min-width: 1280px) {
            body {
                main {
                    h2:first-of-type { display: block; }
                }
            }
        }
            
         /* Breakpoint:  1280px */
        @media (max-width: 1280px) {
            body {
                main {
                    h2:nth-of-type(2) { display: block; }
                    width: 750px;

                    figure.logo {
                        background: url(imgs/pepsi02.png) no-repeat center;
                        height: 370px;
                        margin: 0 auto;
                        width: 348px;
                    }
                }
            }
        }

         /* Breakpoint:  800px */
        @media (max-width: 800px) {
            body {
                main {
                    h2:last-of-type { display: block; }
                    h2:nth-of-type(2) { display: none; }
                    width: 350px;

                    figure.logo {
                        background: url(imgs/pepsi03.png) no-repeat center;
                        height: 156px;
                        margin: 0 auto;
                        width: 162px;
                    }
                }
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <figure class="logo" src="images/pepsi01.png" alt="logo">
            </figure>
            <menu>
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">products</a>
                <a href="">Services</a>
                <a href="">Contact</a>
              </menu>
        </header>
        <section>
            <h2>Desktop: > 1280px </h2>
            <h2>tablet: < 1280px > </1280px> </h2>
            <h2>Mobile: < 800px </h2>
            
        </section>
    </main>
    
</body>
</html>
