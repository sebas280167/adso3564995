<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .jungle {
            position: relative;
            width: 360px;
            height: 440px;
            margin: 1rem auto;
            border: 2px solid red;
            border-radius: 2px;
            outline: 4px solid #fff9;
            background: url("images/jungle.png") no-repeat center / contain;
        }

        .jungle .logo,
        .jungle .dk,
        .jungle .move {
            position: absolute;
            top: 200px;
            left: 0;
        }

        .jungle .logo {
            top: 34px;
            left: 24px;
            animation: animLogo 4s infinite ease;
        }

        .jungle .dk {
            top: 160px;
            left: 110px;
            width: 140px;
            animation: jumpDK 2.8s infinite ease-in-out;
        }

        .jungle .move {
            top: 286px;
            left: 0;
            width: 100%;
            height: 130px;
            overflow: hidden;
        }

        .jungle .move .ryno {
            position: absolute;
            top: 0;
            width: 120px;
            animation: runRyno 2.8s linear infinite;
        }

        @keyframes animLogo {
            0%,
            100% {
                transform: scale(1.8);
            }

            50% {
                transform: scale(1.12);
            }
        }

        @keyframes jumpDK {
            0% {
                transform: translateY(0) scale(1) rotateX(0deg);
                top: 170px;
            }

            44% {
                transform: translateY(-20px) scale(0.75) rotateX(0deg);
                top: 70px;
            }

            52% {
                transform: translateY(-20px) scale(0.75) rotateX(180deg);
                top: 70px;
            }

            56% {
                transform: translateY(-10px) scale(0.85) rotateX(90deg);
                top: 90px;
            }

            60% {
                transform: translateY(0) scale(1) rotateX(0deg);
                top: 110px;
            }

            70% {
                transform: translateY(0) scale(1) rotateX(0deg);
                top: 170px;
            }

            100% {
                transform: translateY(0) scale(1) rotateX(0deg);
                top: 170px;
            }
        }

        @keyframes runRyno {
            0% {
                opacity: 1;
                transform: translateX(0) scaleX(1);
            }

            54% {
                opacity: 1;
                transform: translateX(360px) scaleX(1);
            }

            57% {
                opacity: 1;
                transform: translateX(360px) scaleX(-1);
            }

            99% {
                opacity: 1;
                transform: translateX(0) scaleX(-1);
            }

            100% {
                transform: translateX(0) scaleX(1);
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>37-animations</h1>
            <img src="../src/imagenes/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <div class="jungle">
                <img src="images/logo-dk.png" class="logo" alt="logo-dk">
                <img src="images/dk.png" class="dk" alt="dk">
                <div class="move">
                    <img src="images/ryno.png" class="ryno" alt="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
