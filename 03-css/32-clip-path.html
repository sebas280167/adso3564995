<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .clip {
            background: url(images/pittsburgh.jpg) no-repeat center / cover;
            margin: 2rem auto;
            height: 240px;
            width: 340px;
            transition: all 0.5s ease;
        }

        .clip1 {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .clip2 {
            clip-path: polygon(52% 65%, 21% 28%, 51% 64%, 78% 65%, 78% 65%, 43% 19%, 77% 29%, 37% 39%, 32% 17%, 60% 17%, 75% 18%, 90% 28%, 87% 46%, 26% 70%, 24% 58%, 19% 47%, 20% 36%);
        }
        .clip3 {
            clip-path: polygon(0% 0%, 0% 100%, 25% 100%, 25% 25%, 75% 25%, 75% 75%, 25% 75%, 25% 100%, 100% 100%, 100% 0%);
        }
    </style>
</head>
