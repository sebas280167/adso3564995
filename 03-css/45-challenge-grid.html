<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid
    </title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        html,
        body.css {
            background: #0b1d3a url("images/fondo.webp") center / cover fixed no-repeat !important;
        }

        header {
            text-align: center;
            color: white;
        }

        section {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px;
            grid-gap: 20px;

           /* galeria 1 */
           div.imagenes {
            display: grid;
            grid-gap: 10px;
            padding: 10px;
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
            background: #88d030;
            box-shadow: 0 10px 30px black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 230px 230px 230px;
            grid-template-areas: "a b c"
                                "d b e"
                                "f f g";

           img {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            border: 3px solid #f5ecd7;
            box-sizing: border-box;
            object-fit: cover;
            transition: 0.4s ease;

            &:hover {
                transform: scale(1.08);
            }

           }
           .img1 {
            grid-area: a;

           }
           .img2 {
            grid-area: b;

           }
           .img3 {
            grid-area: c;

           }
           .img4 {
            grid-area: d;

           }
           .img5 {
            grid-area: e;

           }
           .img6 {
            grid-area: f;

           }
           .img7 {
            grid-area: g;

           }
        }

        /* galeria 2 */
        div.fotos {
            display: grid;
            grid-gap: 10px;
            padding: 10px;
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            background: black;
            box-shadow: 0 10px 30px black;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 150px 150px 150px 150px;
            grid-template-areas: "one one"
                                "two three"
                                "four five"
                                "four six";

            img {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            border: 3px solid #f5ecd7;
            box-sizing: border-box;
            object-fit: cover;
            transition: 0.4s ease;

            &:hover {
                transform: scale(1.08);
            }
            }

            .foto1 {
                grid-area: one;
            }
            .foto2 {
                grid-area: two;
            }
            .foto3 {
                grid-area: three;
            }
            .foto4 {
                grid-area: four;
            }
            .foto5 {
                grid-area: five;
            }
            .foto6 {
                grid-area: six;
            }
        }
    }

    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">

            </path>
        </svg>
        </a>
    </nav>
<main>
    <header class="mmenu internal">
        <h1>45-Challenge Grid
        </h1>
        <img src="../src/images/logo-css.png" alt="Css">
        <h3>Irregular Gallery</h3>
    </header>
    <section>
        <h3 class="subtitle">Galery 1</h3>
            <div class="imagenes">
                <img src="images/shin.webp" alt="" class="img1">
                <img src="images/Castillo_ambulante.jpg" alt="" class="img2">
                <img src="images/atelier.webp" alt="" class="img3">
                <img src="images/titan.jpg" alt="" class="img4">
                <img src="images/clevates.webp" alt="" class="img5">
                <img src="images/se levanta el viento.jpg" alt="" class="img6">
                <img src="images/mairimashita.jpeg" alt="" class="img7">

            </div>
    </section>
     <section>
        <h3 class="subtitle">Galery 2</h3>
        <div class="fotos">
                <img src="images/gachiakuta.webp" alt="" class="foto1">
                <img src="images/bill.jpg" alt="" class="foto2">
                <img src="images/naruto.webp" alt="" class="foto3">
                <img src="images/jujutsu kaisen.webp" alt="" class="foto4">
                <img src="images/kaiju.webp" alt="" class="foto5">
                <img src="images/bleach.webp" alt="" class="foto6">

            </div>
    </section>


</main>
</body>
</html>
